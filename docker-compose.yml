services:
  sh-ads-desk:
    build: .
    container_name: sh-ads-desk
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      SH_ADS_DATA_DIR: "/app/data"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  worker:
    build: .
    container_name: sh-ads-desk-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      SH_ADS_DATA_DIR: "/app/data"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: sh-ads-desk-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
